services:
  postgres:
    image:   postgres:18
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER:     postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB:       ai_gateway
    volumes:
      - pg_data:/var/lib/postgresql/18/docker
    # docker compose up --wait only waits for a healthcheck.
    healthcheck:
      test:     ["CMD-SHELL", "pg_isready -U postgres -d ai_gateway"]
      interval: 5s
      timeout:  5s
      retries:  5

  valkey:
    image:   valkey/valkey:9
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - valkey_data:/data
    healthcheck:
      test:     ["CMD", "valkey-cli", "ping"]
      interval: 5s
      timeout:  5s
      retries:  5

  # Local storage for customer application traces. The gateway-facing OTLP
  # endpoint is http://victoria-traces:10428/insert/opentelemetry/v1/traces.
  victoria-traces:
    image:   victoriametrics/victoria-traces:v0.10.0
    restart: unless-stopped
    command:
      - -storageDataPath=/victoria-traces-data
    ports:
      - "10428:10428"  # OTLP/HTTP, query API, and VMUI
    volumes:
      - victoria_traces_data:/victoria-traces-data
    healthcheck:
      # The hardened image has no shell or HTTP client. If the server process
      # exits, the container stops.
      test:     ["CMD", "/victoria-traces-prod", "-version"]
      interval: 5s
      timeout:  5s
      retries:  5

  minio:
    image:   minio/minio:latest
    restart: unless-stopped
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"  # S3 API - must match S3_ENDPOINT
      - "9001:9001"  # web console
    environment:
      MINIO_ROOT_USER:     minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    volumes:
      - minio_data:/data
    healthcheck:
      test:     ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout:  5s
      retries:  5

  # Creates the bucket and exits. MinIO has no declarative bucket config, so
  # without this the first log write fails against an empty server.
  minio-init:
    image:      minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 minioadmin minioadmin &&
      mc mb --ignore-existing local/ai-gateway-logs &&
      mc mb --ignore-existing local/ai-gateway-logs-test
      "

volumes:
  pg_data:
  valkey_data:
  victoria_traces_data:
  minio_data:
