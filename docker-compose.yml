services:
  postgres:
    image:          postgres:18
    container_name: postgres
    restart:        unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER:     postgres
      POSTGRES_PASSWORD: postgres
      # Must match the database in POSTGRES_CONNECTION_STRING - this is the one
      # both the app and drizzle-kit connect to.
      POSTGRES_DB:       ai_gateway
    volumes:
      - pg_data:/var/lib/postgresql/18/docker

  valkey:
    image:          valkey/valkey:9
    container_name: valkey
    restart:        unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - valkey_data:/data

  # Log request/response payloads. S3-compatible, so the app talks to it with
  # the same client it would use against real S3 - only S3_ENDPOINT differs.
  minio:
    image:          minio/minio:latest
    container_name: minio
    restart:        unless-stopped
    command:        server /data --console-address ":9001"
    ports:
      - "9000:9000"  # S3 API - must match S3_ENDPOINT
      - "9001:9001"  # web console
    environment:
      MINIO_ROOT_USER:     minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    volumes:
      - minio_data:/data
    healthcheck:
      test:     ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout:  5s
      retries:  5

  # Creates the bucket and exits. MinIO has no declarative bucket config, so
  # without this the first log write fails against an empty server.
  minio-init:
    image:      minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 minioadmin minioadmin &&
      mc mb --ignore-existing local/ai-gateway-logs
      "

volumes:
  pg_data:
  valkey_data:
  minio_data:
