version: 2

updates:
  # One entry covers every workspace. Bun resolves the whole monorepo from the
  # root lockfile, so pointing Dependabot at a nested package.json would only
  # produce updates it cannot apply.
  - package-ecosystem: npm
    directory:         /
    schedule:
      interval: weekly
      day:      monday
    open-pull-requests-limit: 5
    groups:
      # A week's worth of patch and minor bumps arrive as one PR. Majors stay
      # separate on purpose.
      minor-and-patch:
        applies-to: version-updates
        update-types:
          - minor
          - patch

  # Workflow files under .github/workflows.
  - package-ecosystem: github-actions
    directory:         /
    schedule:
      interval: weekly
      day:      monday
    groups:
      actions:
        patterns: ['*']

  # Doesn't recurse down, need to explicitly point it at the setup action
  # directory.
  - package-ecosystem: github-actions
    directory:         /.github/actions/setup
    schedule:
      interval: weekly
      day:      monday
