name: Publish

# Called by CI once every check on a pushed commit has passed.
on:
  workflow_call:
  workflow_dispatch:
  schedule:
    - cron:     '0 0 * * 1'
      timezone: America/New_York

# Queue publishes so concurrent runs cannot race to move mutable tags such as
# `latest` or a SemVer series tag such as `1.2`.
concurrency:
  group:              publish
  cancel-in-progress: false
  queue:              max

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io

jobs:
  images:
    name:            ${{ matrix.app }}
    runs-on:         ubuntu-latest
    timeout-minutes: 30

    permissions:
      contents: read
      packages: write

    strategy:
      fail-fast: false # One app failing shouldn't fail everything.
      matrix:
        app:
          - gateway-backend
          - gateway-frontend
          - worker-analytics-rollup
          - worker-model-catalog
          - worker-webhooks

    steps:
      - uses: actions/checkout@v7

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to the registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set tags and labels
        id:   meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository }}/${{ matrix.app }}
          tags: |
            type=sha,format=long,enable=${{ github.event_name != 'schedule' }}
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=schedule,pattern={{date 'YYYYMMDD'}}
            type=raw,value=latest,enable={{is_default_branch}}

      # Context is the repository root, not the app directory. Each Dockerfile
      # starts with `turbo prune` so we need the full workspace.
      - name: Build and push
        id:   build
        uses: docker/build-push-action@v7
        with:
          context:    .
          push:       true
          file:       apps/${{ matrix.app }}/Dockerfile
          tags:       ${{ steps.meta.outputs.tags }}
          labels:     ${{ steps.meta.outputs.labels }}
          sbom:       true
          # Scoped per app so three parallel builds don't stomp each
          # other's layers.
          cache-from: type=gha,scope=${{ matrix.app }}
          cache-to:   type=gha,mode=max,scope=${{ matrix.app }}

      # Scans the image that was just pushed by digest rather than by tag, so
      # this is provably the artifact that the build produced.
      - name: Scan the image for known vulnerabilities
        uses: anchore/scan-action@v7
        with:
          image:           ${{ env.REGISTRY }}/${{ github.repository }}/${{ matrix.app }}@${{ steps.build.outputs.digest }}
          severity-cutoff: high
          only-fixed:      true
          fail-build:      true
          cache-db:        true
