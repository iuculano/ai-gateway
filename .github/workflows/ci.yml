name: CI

on:
  pull_request:
  push:
    branches: [main]
    tags:     ['v*']
  workflow_dispatch:

# New commit should supersede the previous and cancel it.
concurrency:
  group:              ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  TURBO_TELEMETRY_DISABLED: 1
  DO_NOT_TRACK:             1

jobs:
  lint:
    name:            Lint and format
    runs-on:         ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup
        with:
          # Biome does not go through turbo, so there is no cache to keep.
          turbo-cache: 'false'

      # `biome ci` is the non-writing counterpart to `lint` plus `format` plus
      # the import sorter.
      - name: Check formatting, lints and import order
        run:  bun run check # maybe think of a better name...

  check-types:
    name:            Types
    runs-on:         ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup

      - name: Type check every workspace
        run:  bun run check-types

  audit:
    name:            Audit
    runs-on:         ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v5

      # `bun audit` resolves from bun.lock, so having
      # the dependency tree on disk would buy nothing.
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      # || true is to avoid failing the workflow, it'll just force the shell
      # command to succeed so we always print everything out.
      - name: Report every advisory
        run:  bun audit || true

      # Avoid blocking for a low or moderate advisory, but fail on high or
      # critical.
      - name: Fail on high or critical
        run:  bun audit --audit-level=high

  test-unit:
    name:            Unit tests
    runs-on:         ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup

      - name: Run unit tests
        run:  bun run test:unit

  test-integration:
    name:            Integration tests
    runs-on:         ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup

      - name: Run integration tests
        run:  bun run test:integration

      # Tests in prior step failed - try to preserve service logs before the
      # runner is destroyed by just dumping the last 100 lines to output.
      - name: Dump service logs
        if:   failure()
        run:  docker compose logs --no-color --tail 100

      # Nothing tears the services down - the runner is discarded either way.
      # Don't try to `docker compose down --volumes` - you will smash your own
      # local dev environment if you're using ACT!

  build:
    name:            Build
    runs-on:         ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup

      - name: Build every workspace
        run:  bun run build

  # Only bother with trying to kick off the publish workflow if everything else
  # has passed up til this point.
  publish:
    name:  Publish
    needs: [lint, check-types, audit, test-unit, test-integration, build]
    if:    github.event_name == 'push'
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/publish.yml
