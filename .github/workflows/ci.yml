name: CI

on:
  pull_request:
  push:
    branches: [main]
    tags:     ['v*']
  workflow_dispatch:

# Superseded pull request runs are worth nothing, so cancel them. Pushes to main
# and tags are exempt: each one gates a publish, so each needs its own verdict.
concurrency:
  group:              ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  TURBO_TELEMETRY_DISABLED: 1
  DO_NOT_TRACK:             1

jobs:
  lint:
    name:            Lint and format
    runs-on:         ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup
        with:
          # Biome does not go through turbo, so there is no cache to keep.
          turbo-cache: 'false'

      # `biome ci` is the non-writing counterpart to `lint` plus `format` plus
      # the import sorter, which is what the editor integration applies on save.
      - name: Check formatting, lints and import order
        run:  bun run check

  check-types:
    name:            Types
    runs-on:         ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup

      - name: Type check every workspace
        run: bun run check-types

  audit:
    name:            Audit
    runs-on:         ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v5

      # Not the workspace setup: `bun audit` resolves from bun.lock, so having
      # the dependency tree on disk would buy nothing.
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      # Informational. `--audit-level` filters output as well as the exit code,
      # so without this pass the lower advisories would never be printed at all.
      - name: Report every advisory
        run:  bun audit || true

      # The gate. Only high and critical fail: a moderate advisory in a
      # transitive dev dependency should not block every merge in the repository
      # until someone upstream publishes a fix.
      - name: Fail on high or critical
        run:  bun audit --audit-level=high

  test-unit:
    name:            Unit tests
    runs-on:         ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup

      - name: Run unit tests
        run:  bun run test:unit

  test-integration:
    name:            Integration tests
    runs-on:         ubuntu-latest
    timeout-minutes: 15

    env:
      POSTGRES_TEST_ADMIN_CONNECTION_STRING: postgresql://postgres:postgres@localhost:5432/ai_gateway_test
      REDIS_TEST_URL:                        redis://localhost:6379/15
      REDIS_PACKAGE_TEST_URL:                redis://localhost:6379/14
      S3_TEST_ENDPOINT:                      http://localhost:9000
      S3_TEST_ACCESS_KEY_ID:                 minioadmin
      S3_TEST_SECRET_ACCESS_KEY:             minioadmin
      S3_TEST_BUCKET:                        ai-gateway-logs-test
      S3_TEST_REGION:                        us-east-1

    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup

      # The same compose file developers run, rather than a second copy of the
      # service definitions as GitHub `services:`. That keeps one place to bump
      # Postgres, and means CI cannot quietly drift onto different versions than
      # the machine the tests were written on. minio-init is a one-shot bucket
      # create, so it runs separately from the long-lived services.
      - name: Start Postgres, Valkey and MinIO
        run: |
          docker compose up --detach --wait postgres valkey minio
          docker compose run --rm -T minio-init

      # `test:db:setup` is not run by hand here - turbo runs it as a dependency
      # of `test:integration`, so the ordering lives in one place.
      - name: Run integration tests
        run:  bun run test:integration

      # A failure here is usually a service that never came up, and the runner
      # is gone before anyone can look.
      - name: Dump service logs
        if:   failure()
        run:  docker compose logs --no-color --tail 100

      # Nothing tears the services down - the runner is discarded either way.
      # Don't try to `docker compose down --volumes` - you will smash your own
      # local dev environment if you're using ACT!

  build:
    name:            Build
    runs-on:         ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup

      - name: Build every workspace
        run:  bun run build

  # Images are only worth building from a commit that passed everything, so this
  # gates on the full set rather than racing them in a separate workflow.
  publish:
    name:  Publish
    needs: [lint, check-types, audit, test-unit, test-integration, build]
    if:    github.event_name == 'push'
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/publish.yml
